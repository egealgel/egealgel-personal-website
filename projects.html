<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="projects | ege algel personal website" data-tr="projeler | ege algel kişisel site">projects | ege algel personal website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="langbar">
    <button class="lang-btn" id="langBtn" type="button" aria-label="Change language">
      <span data-lang="en">en</span><span class="sep">/</span><span data-lang="tr">tr</span>
    </button>
  </div>

  <div class="wrap">
    <header>
      <div class="site-name"><a href="index.html">Ege Algel</a></div>
      <p class="tagline"
         data-en="artificial intelligence · mobile app development · music"
         data-tr="yapay zeka · mobil uygulama geliştirme · müzik">artificial intelligence · mobile app development · music</p>

      <nav class="menu">
        <a href="index.html" data-en="Home" data-tr="Ana Sayfa">Home</a>
        <a href="about.html" data-en="About" data-tr="Hakkımda">About</a>
        <a href="projects.html" class="active" data-en="Projects" data-tr="Projeler">Projects</a>
        <a href="music.html" data-en="Music" data-tr="Müzik">Music</a>
        <a href="travel.html" data-en="Travel" data-tr="Seyahat">Travel</a>
        <a href="contact.html" data-en="Contact" data-tr="İletişim">Contact</a>
      </nav>
    </header>

    <main>
      <h1 class="page-title" data-en="Projects" data-tr="Projeler">Projects</h1>
      <p class="repo-loading" id="repoStatus"
         data-en="loading projects from github…" data-tr="projeler github'dan yükleniyor…">loading projects from github…</p>
      <!-- lang="en" keeps repo names/descriptions cased correctly regardless of UI language -->
      <div class="repo-list" id="repoList" lang="en"></div>
      <p class="more-link">
        <a href="https://github.com/egealgel" target="_blank" rel="noopener"
           data-en="more projects on github →" data-tr="daha fazla proje github'da →">more projects on github →</a>
      </p>
    </main>

    <footer>
      <span data-en="designed by ege" data-tr="designed by ege">designed by ege</span>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    (function () {
      var USER = "egealgel";
      // Öne çıkan projeler — istediğin repo adını ekle/çıkar, bu sıra korunur:
      var FEATURED = [
        "ARDA-autonomous-research-and-dev-agent",
        "ArmoredRecognizer",
        "yukustu_app",
        "SpotiNotch",
        "FacetoEmoji"
      ];
      var listEl = document.getElementById("repoList");
      var statusEl = document.getElementById("repoStatus");

      function esc(s) {
        return (s || "").replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      fetch("https://api.github.com/users/" + USER + "/repos?per_page=100&sort=pushed")
        .then(function (r) {
          if (!r.ok) throw new Error("github " + r.status);
          return r.json();
        })
        .then(function (all) {
          var byName = {};
          all.forEach(function (r) { byName[r.name.toLowerCase()] = r; });
          // Keep only featured repos, in the FEATURED order
          var repos = FEATURED
            .map(function (n) { return byName[n.toLowerCase()]; })
            .filter(Boolean);

          if (!repos.length) { statusEl.textContent = "no projects to show."; return; }
          statusEl.style.display = "none";

          listEl.innerHTML = repos.map(function (r) {
            var lang = r.language
              ? '<span class="repo-lang"><span class="dot"></span>' + esc(r.language) + "</span>"
              : "";
            var stars = r.stargazers_count
              ? "<span>★ " + r.stargazers_count + "</span>" : "";
            var desc = r.description
              ? '<div class="repo-desc">' + esc(r.description) + "</div>" : "";
            return '<div class="repo">' +
                     '<div class="repo-name"><a href="' + esc(r.html_url) + '" target="_blank" rel="noopener">' + esc(r.name) + "</a></div>" +
                     desc +
                     '<div class="repo-meta">' + lang + stars + "</div>" +
                   "</div>";
          }).join("");
        })
        .catch(function (e) {
          statusEl.setAttribute("data-en", "couldn't load projects — see github.com/egealgel");
          statusEl.setAttribute("data-tr", "projeler yüklenemedi — github.com/egealgel adresine bak");
          statusEl.innerHTML = 'couldn\'t load projects — <a href="https://github.com/' + USER + '" target="_blank" rel="noopener">github.com/' + USER + "</a>";
        });
    })();
  </script>
</body>
</html>

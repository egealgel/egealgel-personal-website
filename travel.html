  <script>
    (function () {
      var map = document.getElementById("worldmap");
      var tip = document.getElementById("mapTip");
      var wrap = map.parentElement;

      var VISITED = ["Turkey", "Portugal", "Germany", "Sweden", "Netherlands"];
      var PLANNED = ["Spain"];

      function mark(names, cls) {
        names.forEach(function (n) {
          map.querySelectorAll('.country[data-name="' + n + '"]').forEach(function (p) {
            p.classList.add(cls);
          });
        });
      }
      mark(VISITED, "visited");
      mark(PLANNED, "planned");

      map.addEventListener("mousemove", function (e) {
        var t = e.target;
        if (t && t.classList && t.classList.contains("country")) {
          var name = t.getAttribute("data-name");
          var soon = (document.documentElement.lang === "tr") ? "yakında!" : "soon!";
          tip.textContent = t.classList.contains("planned") ? (name + " — " + soon) : name;
          tip.hidden = false;
          var r = wrap.getBoundingClientRect();
          tip.style.left = (e.clientX - r.left) + "px";
          tip.style.top = (e.clientY - r.top) + "px";
        } else {
          tip.hidden = true;
        }
      });
      map.addEventListener("mouseleave", function () { tip.hidden = true; });
    })();
  </script>
